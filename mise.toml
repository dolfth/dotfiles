# Base config: always loaded. Per-host vars (the fallback values) and the
# dotfiles every machine gets; per-machine modules are selected in
# miserc.local.toml (machine-local, never committed) with
# env = ["mac", "gza"]  and so on. See README.md.

[vars]
# Fallback for a host with no module yet: a new Mac selected with only
# env = ["mac"] gets the laptop defaults.
host = "localhost"
accent = "color_blue"
icon = "\U000F033D"   # nf-md-linux

# Tailscale MagicDNS domain: hosts are reachable as <host>.<tailnet>.
tailnet = "foxhound-insen.ts.net"

# omp's baseUrl for machines that are not the omlx host itself; the gza
# module overrides with 127.0.0.1. The FQDN (the tailnet, above): MagicDNS
# resolves <host>.<tailnet>, never the bare hostname.
omp_base = "gza.foxhound-insen.ts.net"

# Public SSH keys, mirrored from https://github.com/dolfth.keys (that page
# is the canonical record: when a host rotates its key or a new machine
# joins, its key goes on the page and here). Each host signs its commits
# with its own ~/.ssh/id_ed25519; these fill ~/.config/git/allowed_signers
# so every host can verify every other's.
ssh_keys = """
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBA2RcuVWjT5vlSHUdcNi8hWcG5xiRI1BJcHjlWq1dqY
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEburPU7lpE3tnJac9R5jAbMTDqb0FA02Jqt0qVsVeUh
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzF3Gb0SGSSL6C4xYZ/rNfVrhEcWTgRbHnXUecY62s2
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPNrEPG5Srx81xQTYTGqnZulXV4fWZQA/ooLJsUx856N
"""

[dotfiles]
# Declared here, they go to every machine; per-host dotfiles live in the
# host module. ~/.gitconfig would override ~/.config/git/config, so keep it
# removed.
"~/.config/git/config" = "git/config"
"~/.config/git/allowed_signers" = { source = "git/allowed_signers.tera", mode = "template" }
"~/.gitconfig" = { mode = "absent" }

# On nwa, home-manager owns the functions directory, so up.fish deploys from
# the mac module.
"~/.config/fish/config.fish" = "fish/config.fish"

"~/.config/starship.toml" = { source = "starship.toml.tera", mode = "template" }
"~/.config/ghostty/config" = "ghostty/config"
# The nvim config is retired (the editor is now helix, a brew formula); the
# absent entry removes the file the old entry deployed.
"~/.config/nvim/init.lua" = { mode = "absent" }

[settings]
# Trust for the `bootstrap` task gate. mise >= 2026.10.19 refuses to run the
# `bootstrap` task (and every task it reaches) unless the config they come
# from is trusted, and its trust store is per-machine state that a fresh
# machine or a re-adopt does not have. `trusted_config_paths` is read from the
# global config before any trust decision, and this directory is the global
# config directory -- which is where mise-tasks/ lives -- so the entry travels
# with the checkout and passes the gate on every machine that loads it.
# (The error message's own suggestion, `mise trust ~/.config/mise`, is a
# no-op in this layout: it normalizes to `~`, which is already trusted, and
# records nothing for the checkout itself.)
trusted_config_paths = ["~/.config/mise"]

[bootstrap.hooks]
# Both no-op off macOS (they guard on uname), so they are safe in the base
# for all three machines. defaults-snapshot is taken before bootstrap writes
# the declarative defaults, so the final system check can skip the UI
# restart when nothing the UI reads changed. brew-bundle runs `brew bundle`
# over the Brewfiles (brew is a bootstrap dependency on the Macs -- see
# README, "Why brew + mise"); it installs what is missing and never upgrades
# what is present (upgrades are `up`'s job), and warns instead of aborting
# the bootstrap when a download fails, so the dotfiles and agents still
# deploy.
#
# The prologue (repeated in both hooks): when bootstrap runs in a
# non-login ssh session -- mise bootstrap remote -- the inherited PATH
# holds only the bare system directories, so resolve mise there (brew's
# prefix, the Nix store, the mise-run install) and put its directory on
# PATH before `mise run`; that also puts brew on PATH for brew-bundle.
# Locally, mise is already on PATH and the prologue is a no-op.
pre-packages = """
resolve_mise() {
  if ! command -v mise >/dev/null 2>&1; then
    for d in /opt/homebrew/bin /run/current-system/sw/bin "$HOME"/.local/share/mise/bin "$HOME"/.local/bin "$HOME"/.cargo/bin /usr/local/bin; do
      [ -x "$d/mise" ] && PATH="$d:$PATH" && break
    done
  fi
}
resolve_mise
mise run defaults-snapshot && mise run brew-bundle
"""
final = """
resolve_mise() {
  if ! command -v mise >/dev/null 2>&1; then
    for d in /opt/homebrew/bin /run/current-system/sw/bin "$HOME"/.local/share/mise/bin "$HOME"/.local/bin "$HOME"/.cargo/bin /usr/local/bin; do
      [ -x "$d/mise" ] && PATH="$d:$PATH" && break
    done
  fi
}
resolve_mise
mise run herdr-plugins && mise run vscode-extensions && mise run system-check && mise run apple-intelligence
"""

[bootstrap.remote]
# The fleet inventory for `mise bootstrap remote` (README, "Fleet sync").
# Any machine can run it -- gza is the default (always on, so the fleet is
# always reachable); adding a machine here joins the fleet on every machine.
# Host values are literal, not templates, so the tailnet name is repeated.
#
# mise_env is authoritative for the remote run: MISE_ENV replaces the
# host's own miserc.local.toml selection (a brand-new machine has none),
# so keep it in sync with each machine's local file.
#
# No `source`: run with `--adopt` (the tracked tree is transferred as a git
# bundle -- untracked files never leave the repo). A later run reuses the
# existing checkout as-is, so pass --update to fast-forward it first;
# without it a host behind main silently re-applies its stale commit, and
# the --update fetch runs under the host's GitHub key. The Macs run under
# the orchestrator's staged copy (same platform); nwa is cross-platform,
# and the orchestrator's mise is a Homebrew build that mise will not
# replace with an official release binary, so nwa runs under its own mise;
# orchestrators through 2026.10.19 ignore the `remote_mise` config field,
# so the command line passes --remote-mise for nwa. The checkout must be
# on main and clean.

[bootstrap.remote.hosts.mca]
host = "mca.foxhound-insen.ts.net"
mise_env = ["mac", "mca"]
tags = ["mac"]

[bootstrap.remote.hosts.gza]
host = "gza.foxhound-insen.ts.net"
mise_env = ["mac", "gza"]
tags = ["mac"]

[bootstrap.remote.hosts.nwa]
host = "nwa.foxhound-insen.ts.net"
mise_env = ["nwa"]
remote_mise = "/home/dolf/.local/bin/mise"
tags = ["nix"]
# nwa runs Tailscale SSH: visit the one-off approval URL it prints for the
# first connection, then approve the key persistently in the admin console
# for unattended runs (README, "Bootstrap nwa").
