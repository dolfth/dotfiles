# Base config, always loaded: fallback vars and the dotfiles every machine
# gets. Host modules (mise.<env>.toml) are selected in the machine-local,
# uncommitted miserc.local.toml -- the pre-packages hook writes the mac
# fallback on a fresh checkout. See README.md.

# mise below this refuses every command with an upgrade hint. It is honored
# in the global config too (this directory), not just project configs. The
# floor covers what onboarding and `remote_mise` need; raising it re-breaks
# every machine below the new floor until its mise is upgraded. 2026.11.2
# brings task tags, 2026.11.3 the task.logs setting used below.
min_version = "2026.11.3"

[vars]
# Fallback for a host with no module yet: a new Mac selected with only
# env = ["mac"] gets the laptop defaults.
host = "localhost"
accent = "color_blue"
icon = "\U000F033D"   # nf-md-linux

# Tailscale MagicDNS domain: hosts are reachable as <host>.<tailnet>.
tailnet = "foxhound-insen.ts.net"

# omp's baseUrl for machines that are not the omlx host itself; the gza
# module overrides with 127.0.0.1. The FQDN (the tailnet, above): MagicDNS
# resolves <host>.<tailnet>, never the bare hostname.
omp_base = "gza.foxhound-insen.ts.net"

# Public SSH keys, mirrored from https://github.com/dolfth.keys (that page
# is the canonical record: rotate a key or join a machine, update both).
# Each host signs its commits with its own key; these fill
# ~/.config/git/allowed_signers so every host verifies every other's.
ssh_keys = """
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBA2RcuVWjT5vlSHUdcNi8hWcG5xiRI1BJcHjlWq1dqY
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEburPU7lpE3tnJac9R5jAbMTDqb0FA02Jqt0qVsVeUh
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKORTGA2F28t4VWxuvjVPnX9sfZOnNjmR5LoB8uvcwFU
"""

[dotfiles]
"~/.config/git/config" = "git/config"
"~/.config/git/allowed_signers" = { source = "git/allowed_signers.tera", mode = "template" }
# ~/.gitconfig would override ~/.config/git/config, so keep it removed.
"~/.gitconfig" = { mode = "absent" }

"~/.config/fish/config.fish" = "fish/config.fish"

"~/.config/starship.toml" = { source = "starship.toml.tera", mode = "template" }
"~/.config/ghostty/config" = "ghostty/config"

# AeroSpace rewrites this file when the layout changes in-app, so it is a
# merge: our keys win, everything else AeroSpace or the user wrote stays.
"~/.config/aerospace/aerospace.toml/pinned" = { source = "aerospace/aerospace.toml", merge = true }

# config.yml is a symlink, so /settings edits flow back into the repo
# instead of resetting. models.yml is a whole-file template: vars.omp_base
# is 127.0.0.1 on gza (the servers are local there) and the gza tailnet
# FQDN everywhere else.
"~/.omp/agent/config.yml" = "omp/agent/config.yml"
"~/.omp/agent/models.yml" = { source = "omp/agent/models.yml.tera", mode = "template" }

[settings]
# mise >= 2026.10.19 refuses to run tasks unless the config they come from
# is trusted, and trust is per-machine state a fresh machine or re-adopt
# lacks. trusted_config_paths is read from the global config (this
# directory) before any trust decision, so the entry travels with the
# checkout. (The error's own advice, `mise trust ~/.config/mise`, normalizes
# to `~` -- already trusted -- and records nothing here.)
trusted_config_paths = ["~/.config/mise"]

# Keep the full output of each task's last run (mise >= 2026.11.3) so a
# failed bootstrap hook can be read back with `mise tasks log NAME` even
# though the default output style hides passing tasks' lines. Stored under
# ~/.local/state/mise/task-logs/ with owner-only permissions, 4 MiB each.
task.logs = true

[bootstrap.hooks]
# Both tasks no-op off macOS (they guard on uname), so they are safe in the
# base for all three machines. defaults-snapshot must run before bootstrap
# writes the declarative defaults -- the final system check compares against
# it to decide whether UI processes need a restart. brew-bundle is explained
# by its own task header and the README's "Why brew + mise".
#
# The prologue (repeated in both hooks): in a non-login ssh session --
# `mise bootstrap remote` -- the inherited PATH holds only the bare system
# directories, so resolve mise there (brew prefix, Nix store, standalone
# install) before `mise run`; that also puts brew on PATH for brew-bundle.
# Locally mise is already on PATH and the prologue is a no-op.

# Each hook gets its own subtable: the subtable holds `description`
# (mise >= 2026.10.22; `mise bootstrap` prints it instead of the script's
# first line), so two keys cannot share one [bootstrap.hooks].
[bootstrap.hooks.pre-packages]
description = "Write the missing miserc (fresh Mac), gate the config parse, take the defaults snapshot, and bundle the Brewfiles"
# Seeds and gates, in order: writes a missing miserc.local.toml (uncommitted,
# so a fresh checkout has none; the module loads on the *next* invocation --
# mise read the config at startup), then runs `mise env` and fails the
# bootstrap if the config does not parse or has unknown fields. A typo'd key
# otherwise only warns and is ignored, so without this gate the slow phases
# would run on a half-wrong config. (mise 2026.10.x has no validate
# subcommand; `mise env` *is* the config load.)
run = """
resolve_mise() {
  if ! command -v mise >/dev/null 2>&1; then
    for d in /opt/homebrew/bin /run/current-system/sw/bin "$HOME"/.local/share/mise/bin "$HOME"/.local/bin "$HOME"/.cargo/bin /usr/local/bin; do
      [ -x "$d/mise" ] && PATH="$d:$PATH" && break
    done
  fi
}
resolve_mise
# Fresh checkout: write the missing miserc (README, "Config layout").
if [ "$(uname -s)" = "Darwin" ]; then
  repo=$(git rev-parse --show-toplevel 2>/dev/null) || repo=$PWD
  if [ ! -f "$repo/miserc.local.toml" ]; then
    {
      echo '# Per-machine environment selection: which mise.<env>.toml modules to load.'
      echo '# mac: the shared macOS module; then the host module (mise.<host>.toml).'
      echo 'env = ["mac"]'
    } > "$repo/miserc.local.toml"
    mods=""
    for f in "$repo"/mise.*.toml; do [ -e "$f" ] || continue; n=${f##*/mise.}; mods="$mods ${n%.toml}"; done
    echo "Wrote $repo/miserc.local.toml with the mac fallback -- re-run 'mise bootstrap' to load it. If this box is a named machine, add its env name to the file -- available: ${mods# }"
  fi
fi
# Config gate: the warning above is otherwise ignored by mise.
tmp=$(mktemp)
if ! mise env >/dev/null 2>"$tmp"; then
  cat "$tmp" >&2; rm -f "$tmp"
  echo "mise bootstrap: the mise config does not parse; fix it and re-run." >&2
  exit 1
fi
if grep -qE 'unknown field|did you mean' "$tmp"; then
  cat "$tmp" >&2; rm -f "$tmp"
  echo "mise bootstrap: unknown fields in the mise config (above); fix them and re-run." >&2
  exit 1
fi
rm -f "$tmp"
mise run defaults-snapshot && mise run brew-bundle
"""

[bootstrap.hooks.final]
description = "Deploy the herdr and vscodium extensions, run the system check, remove Apple Intelligence, and pin the Finder sidebar"
run = """
resolve_mise() {
  if ! command -v mise >/dev/null 2>&1; then
    for d in /opt/homebrew/bin /run/current-system/sw/bin "$HOME"/.local/share/mise/bin "$HOME"/.local/bin "$HOME"/.cargo/bin /usr/local/bin; do
      [ -x "$d/mise" ] && PATH="$d:$PATH" && break
    done
  fi
}
resolve_mise
mise run herdr-plugins && mise run vscode-extensions && mise run system-check && mise run apple-intelligence && mise run finder-favorites
"""

# Background sync, both Macs. A launchd agent, not a [bootstrap.services]
# user service: mise 2026.10.15 does not render user-service values (an
# unrendered {{ system_brew_prefix }} reached launchd as the literal `{{`),
# while [bootstrap.macos.launchd.agents] does -- see the gza agents.
[bootstrap.macos.launchd.agents.syncthing]
program = "{{ system_brew_prefix }}/opt/syncthing/bin/syncthing"
args = ["serve", "--no-browser", "--no-restart"]
run_at_load = true
keep_alive_on_failure = true
working_directory = "{{ env.HOME }}"
stdout_path = "{{ env.HOME }}/Library/Logs/syncthing.log"
stderr_path = "{{ env.HOME }}/Library/Logs/syncthing.log"
kickstart = true

[bootstrap.remote]
# The fleet inventory for `mise bootstrap remote` (README, "Fleet sync").
# Any machine can orchestrate; gza is the default because it is always on.
# Host values are literal, not templates, so the tailnet name is repeated.
# No mise_env here: the remote run loads each host's own miserc.local.toml
# (a brand-new host has none -- pass --remote-env once). No `source` here:
# run with --adopt, and pass --update so a host behind main does not
# silently re-apply its stale commit.

[bootstrap.remote.hosts.mca]
host = "mca.foxhound-insen.ts.net"
tags = ["mac"]

[bootstrap.remote.hosts.gza]
host = "gza.foxhound-insen.ts.net"
tags = ["mac"]

[bootstrap.remote.hosts.nwa]
host = "nwa.foxhound-insen.ts.net"
remote_mise = "/home/dolf/.local/bin/mise"
tags = ["nix"]
# nwa runs Tailscale SSH: visit the one-off approval URL it prints for the
# first connection, then approve the key persistently in the admin console
# for unattended runs (README, "Bootstrap nwa").
