# nwa: the NixOS server. Select with env = ["nwa"].
#
# The NixOS flake (separate repo) still manages the OS itself -- including
# home-manager's fish functions, which is why this repo deploys only
# config.fish there. mise on nwa comes from Nix, not a package list.

[vars]
host = "nwa"
accent = "color_green"
icon = "\U000F048B"  # nf-md-server

[env]
HOST = "nwa"
KIND = "server"
EDITOR = "nvim"
VISUAL = "nvim"

[dotfiles]
# pi owns its settings file; the merge re-asserts the two pinned keys and
# keeps whatever pi wrote for itself.
"~/.pi/agent/settings.json/pinned" = { source = "pi/agent/settings.json", merge = true }
# herdr rewrites this file itself (config reset-keys, the first-run wizard),
# so it is a copy, not a symlink.
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "copy" }
