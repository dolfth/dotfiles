# nwa: the NixOS server. Select with env = ["nwa"].
#
# The NixOS flake still manages the OS itself (home-manager writes its fish
# functions into ~/.config/fish/functions, so this repo deploys only the
# config there -- see the base mise.toml). mise on nwa comes from Nix, not
# from a package list here.

[vars]
host = "nwa"
accent = "color_green"
icon = "\U000F048B"  # nf-md-server

[env]
HOST = "nwa"
KIND = "server"

[dotfiles]
# omp: the binary is installed by Nix; the config deploys here.
"~/.omp/agent/config.yml" = "omp/agent/config.yml"
"~/.omp/agent/models.yml" = { source = "omp/agent/models.yml.tera", mode = "template" }

# pi owns its settings file (pi install and /settings both write it), so a
# merge entry re-asserts the two pinned keys; everything pi writes for
# itself -- installed extensions, whatever /settings persists -- is kept.
"~/.pi/agent/settings.json/pinned" = { source = "pi/agent/settings.json", merge = true }
# herdr rewrites this file itself (config reset-keys, the first-run wizard),
# so it is a copy, not a symlink.
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "copy" }
