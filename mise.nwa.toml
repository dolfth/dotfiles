# nwa: the NixOS server. Select with env = ["nwa"].
#
# The NixOS flake (separate repo) still manages the OS itself -- including home-manager's
# fish functions, which is why this repo deploys only config.fish there (it comes from
# the base mise.toml). mise is a standalone install in ~/.local/bin, not a package list.
# The agent stack -- omp, pi, herdr -- left nwa (2026-11-24); it lives on gza alone, so
# this module carries the host identity and nothing else.

[vars]
host = "nwa"
accent = "color_green"
icon = "\U000F048B"  # nf-md-server

[env]
HOST = "nwa"
KIND = "server"
EDITOR = "nvim"
VISUAL = "nvim"
