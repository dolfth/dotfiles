# Shared by both Macs: declarative macOS defaults, the editor, and their
# dotfiles. Select in miserc.local.toml:  env = ["mac", "<host>"]

[env]
# mise exports [env] into every activated shell (interactive and --shims),
# so this reaches every fish; zshrc covers the POSIX login shell that skips
# the fish hand-off.
EDITOR = "hx"
VISUAL = "hx"

[vars]
# pared release for the apple-intelligence task (no mainline brew formula,
# no mise backend). Bump to upgrade; the task replaces the binary when the
# version changes.
pared_version = "2.2.0"

##### macOS defaults #####
#
# Mise writes these on every `mise bootstrap`, so settings flipped by hand
# get put back, and deleting a line stops setting it (it does not restore
# the old value).
#
# The sandboxed-app defaults Mail/TextEdit/Displays are NOT here: they
# lives in a container only Full Disk Access can write, which SSH sessions
# lack, so the system-check task applies those (and skips them with a message
# when the terminal lacks FDA).

# No pinned Dock tiles: the empty apps list removes every app tile mise
# recognises, leaving only running applications (and the Trash; folder and
# other tiles in persistent-others are outside mise's apps feature).
# Deliberately the named dock section, not a raw persistent-apps value --
# mise keeps each tile's bookmark while managing the layout, and its status
# reports the layout instead of the raw archive.
[bootstrap.macos.dock]
apps = []

[bootstrap.macos.defaults."com.apple.dock"]
"autohide" = true
"autohide-delay" = 0.0
"autohide-time-modifier" = 0.4
"tilesize" = 64
"showhidden" = true
"enable-spring-load-actions-on-all-items" = true
"launchanim" = false
"minimize-to-application" = true
"mineffect" = "scale"
"expose-animation-duration" = 0.1
"mru-spaces" = false
"show-recents" = false
"expose-group-apps" = true
# Hot corner: bottom-left shows Desktop.
"wvous-bl-corner" = 4

[bootstrap.macos.defaults."com.apple.spaces"]
# true = one Space spans all displays ("Displays have separate Spaces" off);
# works better with AeroSpace
"spans-displays" = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
# Click wallpaper to show Desktop: 0 = only in Stage Manager, 1 = always
"EnableStandardClickToShowDesktop" = 0
# No built-in tiling; AeroSpace manages windows.
"EnableTilingByEdgeDrag" = false
"EnableTopTilingByEdgeDrag" = false
"EnableTilingOptionAccelerator" = false
"EnableTiledWindowMargins" = false

[bootstrap.macos.defaults."com.apple.finder"]
# New window view: Nlsv = list, icnv = icon, clmv = column, Flwv = gallery
"FXPreferredViewStyle" = "clmv"
"ShowPathbar" = true
"ShowStatusBar" = true
"_FXShowPosixPathInTitle" = true
"_FXSortFoldersFirst" = true
"_FXSortFoldersFirstOnDesktop" = true
"FXEnableExtensionChangeWarning" = false
# Search: SCcf = current folder, SCsp = previous, SCev = this Mac
"FXDefaultSearchScope" = "SCcf"
# New windows: PfHm = Home, PfDe = Desktop, PfDo = Documents. The path is
# set in system-check with $USER so it works on any username.
"NewWindowTarget" = "PfHm"
"QuitMenuItem" = true
"FXRemoveOldTrashItems" = true
"ShowMountedServersOnDesktop" = true
"FXInfoPanesExpanded" = { "General" = true, "OpenWith" = true, "Privileges" = true }

[bootstrap.macos.defaults."com.apple.NetworkBrowser"]
# AirDrop over Ethernet and other non-WiFi interfaces
"BrowseAllInterfaces" = true

[bootstrap.macos.defaults."NSGlobalDomain"]
"AppleShowAllExtensions" = true
"InitialKeyRepeat" = 15
"KeyRepeat" = 2
"NSAutomaticCapitalizationEnabled" = false
"NSAutomaticSpellingCorrectionEnabled" = false
"NSContinuousSpellCheckingEnabled" = false
"NSAutomaticQuoteSubstitutionEnabled" = false
"NSAutomaticDashSubstitutionEnabled" = false
"AppleEnableWindowTinting" = false
"com.apple.swipescrolldirection" = false
"NSAppSleepDisabled" = true
"PMPrintingExpandedStateForPrint" = true
"PMPrintingExpandedStateForPrint2" = true
"NSNavPanelExpandedStateForSaveMode" = true
"NSNavPanelExpandedStateForSaveMode2" = true
"AppleActionOnDoubleClick" = "Minimize"
"AppleShowScrollBars" = "Always"
"NSDocumentSaveNewDocumentsToCloud" = false
"AppleHighlightColor" = "0.764700 0.976500 0.568600"
"NSUseAnimatedFocusRing" = false
"NSWindowResizeTime" = 0.001
"NSTextShowsControlCharacters" = true
"NSDisableAutomaticTermination" = true
"NSWindowShouldDragOnGesture" = true
"AppleKeyboardUIMode" = 2
"com.apple.trackpad.scaling" = 2.0
"com.apple.mouse.scaling" = 1.5
"com.apple.mouse.linear" = true
"AppleICUForce24HourTime" = true
"WebKitDeveloperExtras" = true
# AppleInterfaceStyle (manual light/dark) conflicts with the automatic
# switch; a delete has no declarative form, so the system-check task does it.

[bootstrap.macos.defaults."com.apple.LaunchServices"]
# No "downloaded from the internet" dialog; Gatekeeper still blocks unsigned
# apps
"LSQuarantine" = false

[bootstrap.macos.defaults."com.apple.print.PrintingPrefs"]
"Quit When Finished" = true

# com.apple.universalaccess is NOT declared here: macOS TCC-protects it, so
# a non-privileged write (mise's CFPreferencesSynchronize, `defaults write`)
# commits nothing and mise aborts the whole bootstrap on that one domain.
# Its three old toggles are cosmetic -- set them once in System Settings >
# Accessibility (Reduce Transparency; Show window title bar icons; Scroll
# with two fingers to close); they persist.

[bootstrap.macos.defaults."com.apple.HIToolbox"]
# Fn/Globe alone: 0 = nothing, 1 = input source, 2 = emoji, 3 = dictation
"AppleFnUsageType" = 2

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
# Corner: 0 = off, 1 = bottom-left, 2 = bottom-right
"TrackpadCornerSecondaryClick" = 2

[bootstrap.macos.defaults."com.apple.desktopservices"]
"DSDontWriteNetworkStores" = true
"DSDontWriteUSBStores" = true

[bootstrap.macos.defaults."com.apple.screencapture"]
"disable-shadow" = true
"include-date" = false
"show-thumbnail" = false

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
"Show24Hour" = true
"ShowAMPM" = false
"ShowDate" = 1

[bootstrap.macos.defaults."com.apple.ActivityMonitor"]
# Sort by the Memory column (real memory); the stock default is CPU.
"SortColumn" = "ResidentSize"

[bootstrap.macos.defaults."com.apple.ImageCapture"]
"disableHotPlug" = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
"DoNotOfferNewDisksForBackup" = true

[bootstrap.macos.defaults."com.apple.commerce"]
"AutoUpdate" = false

# Safari's default search engine, per device: iCloud's Safari sync covers
# bookmarks, history, Reading List and tabs, never this setting. macOS 14+
# resolves the engine from this system-scoped preference (Safari migrates
# its old per-app key here on launch and records the migration in
# SearchProviderIdentifierMigratedToSystemPreference); the identifier is
# the one DuckDuckGo's own Jamf deployment guide publishes. A path entry
# keeps any other provider dictionaries NSPreferredWebServices may hold.
# The engine is read at Safari launch, so a change applies next start.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "NSPreferredWebServices"
path = ["NSWebServicesProviderWebSearch"]
value = { "NSDefaultDisplayName" = "DuckDuckGo", "NSProviderIdentifier" = "com.duckduckgo" }

[dotfiles]
# A copy, not a symlink: the omp sandbox denies ~/.zshrc (extends: default's
# shell-config rules), nono canonicalizes a deny through a symlink, and the
# rule would therefore deny the repo's own zshrc from the agent that manages
# it. The live rc stays denied either way -- the agent edits the repo copy.
"~/.zshrc" = { source = "zshrc", mode = "copy" }
# A real file at 0600: a symlink would expose the repo file's permissions to
# ssh's checks.
"~/.ssh/config" = { source = "ssh_config", mode = "copy", permissions = "0600" }
# The fleet's login keys, from the ssh_keys var. mise owns the file:
# hand-added keys are overwritten. Not on nwa -- its flake writes
# authorized_keys.
"~/.ssh/authorized_keys" = { source = "ssh/authorized_keys.tera", mode = "template", permissions = "0600" }
# On nwa, home-manager writes its own fish functions there, so this deploys
# only on the Macs.
"~/.config/fish/functions/up.fish" = "fish/functions/up.fish"
"~/.config/fish/functions/mkd.fish" = "fish/functions/mkd.fish"
"~/.config/fish/functions/tstat.fish" = "fish/functions/tstat.fish"
"~/.config/fish/functions/port.fish" = "fish/functions/port.fish"

# LinearMouse creates the file on first run and owns it afterwards, so the
# edit entry only seeds it: written when missing, then only missing keys are
# ever filled in.
"~/.config/linearmouse/linearmouse.json/initial" = { source = "linearmouse.json", merge = "missing" }
