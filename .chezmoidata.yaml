# Per-host settings. accent/icon: prompt colour -- the chezmoi equivalent of
# the `hostThemes` attrset that used to live in the NixOS fish module.
# kind (Macs only): laptop | desktop, picks the power profile in
# run_onchange_30-macos-system-settings.sh.tmpl.
# wiredLimitMb (desktops only): iogpu.wired_limit_mb, the GPU wired-memory
# ceiling omlx reports for this machine's RAM; set by the same script.
#
# Icons are Nerd Font private-use codepoints written as YAML escapes rather than
# literal glyphs, so no editor or terminal can mangle them.
# Tailscale MagicDNS domain: hosts are reachable as <host>.<tailnet>.
tailnet: foxhound-insen.ts.net

hosts:
  nwa:
    accent: color_green
    icon: "\U000F048B"   # nf-md-server
  mca:
    kind: laptop
    accent: color_purple
    icon: "\uF179"       # nf-fa-apple
  gza:
    kind: desktop
    wiredLimitMb: 45056
    accent: color_red
    icon: "\uF179"       # nf-fa-apple

fallback:
  accent: color_blue
  icon: "\U000F033D"     # nf-md-linux

# Public SSH keys, one per host, as listed on https://github.com/dolfth.keys.
# Each host signs its commits with its own ~/.ssh/id_ed25519; these fill
# ~/.config/git/allowed_signers so every host can verify all three. Add a new
# machine's key here as well as on GitHub (as an authentication AND a signing
# key).
sshKeys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBA2RcuVWjT5vlSHUdcNi8hWcG5xiRI1BJcHjlWq1dqY
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzF3Gb0SGSSL6C4xYZ/rNfVrhEcWTgRbHnXUecY62s2
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEburPU7lpE3tnJac9R5jAbMTDqb0FA02Jqt0qVsVeUh
