# gza: the always-on desktop. Local-LLM server (omlx + splash), omp host,
# reachable over SSH / screen sharing / the tailnet. Select with
# env = ["mac", "gza"].

[vars]
host = "gza"
kind = "desktop"
accent = "color_red"
icon = "\uF179"  # nf-fa-apple
# omp's baseUrl: the servers below are local here (the base says "gza").
omp_base = "127.0.0.1"

[env]
HOST = "gza"
KIND = "desktop"
# iogpu.wired_limit_mb, the GPU wired-memory ceiling omlx reports; applied by
# the system-check task's LaunchDaemon.
WIRED_LIMIT_MB = "45056"

[tools]
# The venv base for omlx (the omlx-splash bootstrap task builds the venv
# from it). Declared so `mise prune` never removes it.
python = "3.11"

[bootstrap.brew.taps]
"jundot/omlx" = "https://github.com/jundot/omlx"
# incoai/tap was renamed upstream to incoai/homebrew-tap (the old name 404s
# since 2026-10-19); the formula and keg name are unchanged.
"incoai/homebrew-tap" = "https://github.com/incoai/homebrew-tap"

[bootstrap.packages]
# Run by the user agents below, not `brew services` (a brew service would be
# a second, throttled copy on the same port).
#
# The current mise release (2026.10.14) cannot evaluate the omlx and splash
# definitions (their tap formulas use constructs its metadata shim lacks --
# see the omlx-splash task for the reproducer). They stay listed for status
# display only: resolution is all-or-nothing per batch, and on a fresh
# machine the omlx-splash task pre-installs them, so `apply` finds them
# already installed and never resolves them. The daily upgrade uses the
# named list in the packages-upgrade task, which names every resolvable
# formula of the Mac modules.
#
# omp (can1357/homebrew-tap) is deliberately NOT listed: its formula's
# install step uses `with_env`, which mise's source-build shim rejects
# outright ("formula uses `with_env (install-time helper)`..."), so mise can
# neither install nor upgrade it. The keg, once present, still serves; its
# upgrade lives in the `up` fish function's brew bridge block (machines
# with Homebrew) until mise supports with_env.
"brew:jundot/omlx/omlx" = "latest"
"brew:incoai/homebrew-tap/splash" = "latest"

# The user LaunchAgents that run the local servers. `kickstart` re-asserts
# the job on every bootstrap (idempotent: already-loaded jobs are replaced).
[bootstrap.macos.launchd.agents.omlx]
program = "{{ system_brew_prefix }}/opt/omlx/bin/omlx"
args = ["serve"]
run_at_load = true
keep_alive = true
process_type = "Interactive"
working_directory = "{{ env.HOME }}/.omlx"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/omlx.log"
stderr_path = "{{ env.HOME }}/Library/Logs/omlx.log"
kickstart = true

[bootstrap.macos.launchd.agents.splash]
program = "{{ system_brew_prefix }}/opt/splash/bin/splash"
args = ["serve", "--model", "mlx-community/Qwen3.8-27B-4bit"]
run_at_load = true
keep_alive = true
process_type = "Interactive"
working_directory = "{{ env.HOME }}"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/splash.log"
stderr_path = "{{ env.HOME }}/Library/Logs/splash.log"
kickstart = true

[dotfiles]
# omlx writes these files itself (UI). Each is a merge edit (the id segment
# names the edit within the file) deep over the live file: objects merge,
# arrays and scalars replace, keys omlx wrote that we don't own are never
# touched -- so the auth secrets in settings.json stay local, and the models
# omlx has stay. A missing target is created from the source. Rendered as Tera
# first ({{ vars.host }}, {{ vars.tailnet }}, {{ env.HOME }}).
"~/.omlx/settings.json/pinned" = { source = "omlx/settings.json", merge = true, template = "tera" }
"~/.omlx/model_settings.json/pinned" = { source = "omlx/model_settings.json", merge = true, template = "tera" }
"~/.omlx/model_profiles.json/pinned" = { source = "omlx/model_profiles.json", merge = true, template = "tera" }
# omlx makes settings.json 0600 (it holds the auth keys); a permissions-only
# entry keeps it there even if the file is (re)created at the repo mode.
"~/.omlx/settings.json" = { permissions = "0600" }

# omp: the config is a symlink (local edits flow back to the repo instead of
# resetting); the model catalog is a whole-file template because it renders
# the per-host baseUrl.
"~/.omp/agent/config.yml" = "omp/agent/config.yml"
"~/.omp/agent/models.yml" = { source = "omp/agent/models.yml.tera", mode = "template" }

# The dev.mise.* agents above replace these plists; keep them deleted.
"~/Library/LaunchAgents/com.dolfth.omlx.plist" = { mode = "absent" }
"~/Library/LaunchAgents/com.dolfth.splash.plist" = { mode = "absent" }
