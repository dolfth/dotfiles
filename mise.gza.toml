# gza: the always-on desktop. Local-LLM server (omlx + splash), omp host,
# reachable over SSH / screen sharing / the tailnet. Select with
# env = ["mac", "gza"].

[vars]
host = "gza"
accent = "color_red"
icon = "\U000F01C4"  # nf-md-desktop-mac
# The servers below are local on this host; the base uses the tailnet FQDN.
omp_base = "127.0.0.1"

[env]
HOST = "gza"
KIND = "desktop"
# iogpu.wired_limit_mb, the GPU wired-memory ceiling, applied by the
# system-check task's LaunchDaemon. Every GPU user on the Mac (omlx,
# splash, splash-fn) allocates from this one pool, and the kernel refuses
# no allocation below the ceiling: it is the hard fuse against a
# wired-memory freeze (a ceiling near RAM froze watchdogd and panicked the
# box). 96 GiB = 75% of RAM leaves ~24 GB for the host even with the pool
# full: splash's governor then pauses growth (its documented pending path)
# instead of the machine freezing, and omlx plans itself to this ceiling.
# Running omlx beside a splash server is out of contract: its model would
# need the same pool the server already holds.
WIRED_LIMIT_MB = "98304"

# The user LaunchAgents running the local servers. bootstrap re-writes the
# plist and reloads a job when its definition changes; the per-bootstrap
# self-heal of a dead agent lives in the `bootstrap` task. The GPU wired
# pool (96 GiB fuse) is single-tenant -- `mise run gpupool fn|27|mlx`
# picks who owns it; only the default (flash-fn) is RunAtLoad so nothing
# resurrects a switched-out tenant. omlx must be UNLOADED, not merely
# idle, beside another server: it spawns its own splash engines the moment
# a request arrives. The same rule governs kickstart: a definition with
# kickstart = true is STARTED by every launchd apply that touches it,
# RunAtLoad be damned -- so on-demand tenants keep kickstart = false and
# only gpupool's own kickstart starts them.
[bootstrap.macos.launchd.agents.omlx]
program = "{{ system_brew_prefix }}/opt/omlx/bin/omlx"
args = ["serve"]
run_at_load = false
keep_alive = false
process_type = "Interactive"
working_directory = "{{ env.HOME }}/.omlx"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/omlx.log"
stderr_path = "{{ env.HOME }}/Library/Logs/omlx.log"
kickstart = false

# --host 0.0.0.0 + --allowed-host: omp on the other hosts (mca, nwa)
# reaches splash over the tailnet; the default bind is 127.0.0.1, and a
# client that connects by name also needs --allowed-host. The catalog
# uses the FQDN; the bare tailnet name gza is also accepted, for manual
# clients (http://gza:8000).
[bootstrap.macos.launchd.agents.splash]
# unsloth's Dynamic 3.0 quant: 5.25 bits/param (17.9 GB), finer than the
# mlx-community 4bit at the same size class. The repo ships the mmproj vision
# projector, so no --language-only: vision stays.
# --max-memory 30G caps this server's Metal plan (weights + ~128K KV in RAM,
# the rest over the SSD cache). ON DEMAND: the 96 GiB GPU pool fits one
# splash plan at a time, and below the wired-limit fuse nothing is refused
# -- Metal clients die instead of queueing. `mise run gpupool 27|fn|mlx`
# swaps the pool's owner; run_at_load/keep_alive/kickstart stay off so
# bootstrap, logins and launchd applies never resurrect it -- only gpupool
# kicks.
program = "{{ system_brew_prefix }}/opt/splash/bin/splash"
args = ["serve", "--model", "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL", "--host", "0.0.0.0", "--allowed-host", "gza.foxhound-insen.ts.net", "--allowed-host", "gza", "--max-memory", "30G", "--idle-release", "3m"]
run_at_load = false
keep_alive = false
process_type = "Interactive"
working_directory = "{{ env.HOME }}"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/splash.log"
stderr_path = "{{ env.HOME }}/Library/Logs/splash.log"
kickstart = false

[bootstrap.macos.launchd.agents.splash-fn]
# Qwen3.8-Flash-Next: 125B MoE (6B active) + 51B PLE n-gram table, unsloth's
# Dynamic 3.0 quant: 111 GB image. splash's auto mode plans each server from
# the whole Mac, so --max-memory is the mandatory single-tenant cap: 86G
# charges the expert store (~89% of the 71.7 GiB experts; the rest streams
# with ARC recycling) plus KV inside the 96 GiB fuse, leaving ~6 GiB for the
# GUI's own Metal clients -- the GUI wires part of the same pool, and every
# crash so far was exactly that contest, so the fuse stays closed (90G would
# only double the KV pool). The starved end is 50G: it held 23% of the
# expert slots and decoded at ~25 tok/s with the GPU at 40%.
# Expert store and PLE row cache stay on auto: the store is the throughput
# lever (the docs price each extra GiB at 11-23% decode speed), and auto
# gives the experts everything the plan leaves after the fixed runtime and
# the KV allowance -- a 128K prompt touches ~1.1M rows, so even auto's 256
# MiB PLE row cache hits as often as a pinned 2 GiB one.
# --idle-release 15m: 3m released and restored 19x during one day of agent
# work, taxing each first request ~1.3 s plus a CPU ramp storm; the GUI
# still gets the whole pool back on any real break.
# --max-cache-disk 64G: auto's 32 GiB quota ran to 100.00% full (demotions
# refused, KV state restores p50 262 ms) while the volume kept 357 GB free.
# --thinking-token-budget 8192 bounds requests that bring no thinking budget
# of their own, after one wrote 26,856 thinking tokens (~22 min at 20 tok/s).
# The serve plan lands in ~/Library/Application Support/Splash/runtime/serve-8100.json.
program = "{{ system_brew_prefix }}/opt/splash/bin/splash"
args = ["serve", "--model", "unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL", "--port", "8100", "--host", "0.0.0.0", "--allowed-host", "gza.foxhound-insen.ts.net", "--allowed-host", "gza", "--max-memory", "86G", "--idle-release", "15m", "--max-cache-disk", "64G", "--thinking-token-budget", "8192"]
run_at_load = true
keep_alive = true
process_type = "Interactive"
working_directory = "{{ env.HOME }}"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/splash-fn.log"
stderr_path = "{{ env.HOME }}/Library/Logs/splash-fn.log"
kickstart = true

[dotfiles]
# omlx writes these files itself (UI), so each entry deep-merges over the
# live file: objects merge, arrays and scalars replace, keys we don't own
# survive -- the auth secrets in settings.json and the models omlx has stay
# put. A missing target is created from the source. Rendered as Tera first
# ({{ vars.host }}, {{ vars.tailnet }}, {{ env.HOME }}).
"~/.omlx/settings.json/pinned" = { source = "omlx/settings.json", merge = true, template = "tera" }
"~/.omlx/model_settings.json/pinned" = { source = "omlx/model_settings.json", merge = true, template = "tera" }
"~/.omlx/model_profiles.json/pinned" = { source = "omlx/model_profiles.json", merge = true, template = "tera" }
# omlx makes settings.json 0600 (it holds the auth keys); this keeps it at
# 0600 even if the file is (re)created at the repo mode.
"~/.omlx/settings.json" = { permissions = "0600" }

# pi owns its settings file; the merge re-asserts the two pinned keys and
# keeps whatever pi wrote for itself.
"~/.pi/agent/settings.json/pinned" = { source = "pi/agent/settings.json", merge = true }

# The dev.mise.* agents above replace these plists; keep them deleted.
"~/Library/LaunchAgents/com.dolfth.omlx.plist" = { mode = "absent" }
"~/Library/LaunchAgents/com.dolfth.splash.plist" = { mode = "absent" }
# The retired splash-kat agent (the model became Flash-Next, the splash-fn
# job below); keep its plist deleted.
"~/Library/LaunchAgents/dev.mise.splash-kat.plist" = { mode = "absent" }

