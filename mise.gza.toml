# gza: the always-on desktop. Local-LLM server (omlx + splash), omp host,
# reachable over SSH / screen sharing / the tailnet. Select with
# env = ["mac", "gza"].

[vars]
host = "gza"
accent = "color_red"
icon = "\U000F01C4"  # nf-md-desktop-mac
# The servers below are local on this host; the base uses the tailnet FQDN.
omp_base = "127.0.0.1"

[env]
HOST = "gza"
KIND = "desktop"
# iogpu.wired_limit_mb: the GPU wired-memory ceiling, applied by system-check's
# LaunchDaemon. One pool for every GPU user, nothing refused below the ceiling, so
# the ceiling is the only thing between a full pool and a frozen machine. 96 GiB
# (75% of RAM) leaves the host room; running omlx beside a splash server is out of
# contract -- its model needs the pool the server holds.
WIRED_LIMIT_MB = "98304"

# The local server agents. bootstrap rewrites plists and reloads changed jobs;
# reviving a dead one is the `bootstrap` task's job. The pool is single-tenant, so
# only the default (flash-fn) is RunAtLoad and omlx stays unloaded -- it spawns an
# engine on the first request. kickstart means the same: a definition with it on is
# started by every launchd apply, so on-demand tenants keep it off and only gpupool
# kicks them.
[bootstrap.macos.launchd.agents.omlx]
program = "{{ system_brew_prefix }}/opt/omlx/bin/omlx"
args = ["serve"]
run_at_load = false
keep_alive = false
process_type = "Interactive"
working_directory = "{{ env.HOME }}/.omlx"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/omlx.log"
stderr_path = "{{ env.HOME }}/Library/Logs/omlx.log"
kickstart = false

# --host 0.0.0.0 plus --allowed-host: omp on mca and nwa reaches splash over the
# tailnet, and a client connecting by name needs the allowed-host too. The bare
# tailnet name is accepted for manual clients (http://gza:8000).
[bootstrap.macos.launchd.agents.splash]
# unsloth's Dynamic 3.0 quant: 5.25 bits/param (17.9 GB), finer than the
# mlx-community 4bit at the same size, and the repo ships the mmproj projector so
# vision stays. --max-memory 30G caps the Metal plan (weights plus ~128K KV in
# RAM, the rest on the SSD cache). On demand: one plan fits the pool at a time, so
# run_at_load, keep_alive and kickstart stay off and only `mise run gpupool` kicks.
program = "{{ system_brew_prefix }}/opt/splash/bin/splash"
args = ["serve", "--model", "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL", "--host", "0.0.0.0", "--allowed-host", "gza.foxhound-insen.ts.net", "--allowed-host", "gza", "--max-memory", "30G", "--idle-release", "3m"]
run_at_load = false
keep_alive = false
process_type = "Interactive"
working_directory = "{{ env.HOME }}"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/splash.log"
stderr_path = "{{ env.HOME }}/Library/Logs/splash.log"
kickstart = false

[bootstrap.macos.launchd.agents.splash-fn]
# Qwen3.8-Flash-Next: 125B MoE (6B active) plus a 51B PLE table, Dynamic 3.0
# quant, a 111 GB image. splash plans from the whole Mac, so the flags are the
# contract:
#   --max-memory 86G  expert store plus KV inside the 96 GiB fuse, ~6 GiB left for
#     the GUI's Metal clients. The GUI wires the same pool and every crash so far
#     was that contest. 90G only doubles the KV pool; 50G starved 23% of the expert
#     slots to ~25 tok/s at 40% GPU.
#   --idle-release 15m  3m released and restored 19x in a day of agent work, ~1.3 s
#     on each first request.
#   --max-cache-disk 64G  auto's 32 GiB quota hit 100% with 357 GB free.
#   --thinking-token-budget 8192  one request wrote 26,856 thinking tokens.
# Expert store and PLE row cache stay on auto: each extra GiB of store is worth
# 11-23% decode speed, and auto's small row cache hits as often as a pinned 2 GiB
# one. The serve plan: ~/Library/Application Support/Splash/runtime/serve-8100.json
program = "{{ system_brew_prefix }}/opt/splash/bin/splash"
args = ["serve", "--model", "unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL", "--port", "8100", "--host", "0.0.0.0", "--allowed-host", "gza.foxhound-insen.ts.net", "--allowed-host", "gza", "--max-memory", "86G", "--idle-release", "15m", "--max-cache-disk", "64G", "--thinking-token-budget", "8192"]
run_at_load = true
keep_alive = true
process_type = "Interactive"
working_directory = "{{ env.HOME }}"
environment = { "PATH" = "{{ system_brew_prefix }}/bin:{{ system_brew_prefix }}/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "{{ env.HOME }}/Library/Logs/splash-fn.log"
stderr_path = "{{ env.HOME }}/Library/Logs/splash-fn.log"
kickstart = true

[dotfiles]
# omlx writes these from its UI, so each entry deep-merges over the live file:
# objects merge, arrays and scalars replace, so its auth secrets and model list
# survive. Rendered as Tera first.
"~/.omlx/settings.json/pinned" = { source = "omlx/settings.json", merge = true, template = "tera" }
"~/.omlx/model_settings.json/pinned" = { source = "omlx/model_settings.json", merge = true, template = "tera" }
"~/.omlx/model_profiles.json/pinned" = { source = "omlx/model_profiles.json", merge = true, template = "tera" }
# omlx keeps settings.json 0600 (auth keys); hold that even if it is recreated.
"~/.omlx/settings.json" = { permissions = "0600" }

# pi owns its settings file; the merge re-asserts the two pinned keys and
# keeps whatever pi wrote for itself.
"~/.pi/agent/settings.json/pinned" = { source = "pi/agent/settings.json", merge = true }
# herdr rewrites its config itself (reset-keys, the first-run wizard), so
# this is a copy, not a symlink -- same rule as on nwa. The agent-pane
# keybindings land here because gza hosts the dev agents now.
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "copy" }

