# The server-side backstop for the two portable legs of mise-tasks/check:
# the config gate (leg 1) and shellcheck (leg 2). The local gate is
# core.hooksPath, which --no-verify and a never-bootstrapped checkout skip;
# this copy does not trust the pusher. Legs 3-5 stay local: dotfiles and
# launchd are macOS state.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    # One arm per module: CI has no miserc.local.toml (it lives only in the
    # ~/.config/mise checkout), so MISE_ENV is what drives mise.mac/mca/
    # gza.toml through the parse gate. The base mise.toml loads in every arm.
    # mise itself runs at the min_version floor: CI proves the floor.
    strategy:
      fail-fast: false
      matrix:
        mise_env: [mac, mca, gza]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise at the floor
        run: |
          floor=$(sed -nE 's/^min_version = "([^"]*)"/\1/p' mise.toml | head -1)
          test -n "$floor" || { echo "no min_version in mise.toml" >&2; exit 1; }
          curl -fsSL https://mise.jdx.dev/install.sh | MISE_VERSION="v$floor" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Config gate (${{ matrix.mise_env }})
        env:
          MISE_ENV: ${{ matrix.mise_env }}
        run: |
          mise trust . >/dev/null
          # An unknown field only warns on stderr; it must stop the run,
          # the same gate the pre-packages hook puts before the slow phases.
          if ! mise env >/dev/null 2>mise-err.txt; then
            cat mise-err.txt >&2
            echo "the mise config does not parse" >&2
            exit 1
          fi
          if grep -qE 'unknown field|did you mean' mise-err.txt; then
            cat mise-err.txt >&2
            echo "unknown fields in the mise config" >&2
            exit 1
          fi
          echo "config loads clean"

  shellcheck:
    # The runner image ships shellcheck; the command is byte-identical to
    # leg 2 of mise-tasks/check. -x follows `# shellcheck source=` into
    # _defaults.sh; nono/omp-wrapper.sh joins because find refuses to
    # take a directory's siblings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find mise-tasks -type f -print0 | xargs -0 shellcheck -x nono/omp-wrapper.sh
