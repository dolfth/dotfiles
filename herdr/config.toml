# Managed by mise as a copy, not a symlink: herdr writes this file itself
# (reset-keys, the first-run wizard) -- a symlink would put those writes and
# their backups into the repo checkout. Saved SSH machines are app state in
# this directory, not here.

# The first-run notification wizard persists its answer into this file, so
# opt out up front.
onboarding = false

# prefix is ctrl+b; `type = "pane"` gives a real terminal pane that closes
# when the agent exits.
[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "claude"
description = "sandboxed claude-code"

[[keys.command]]
key = "prefix+alt+p"
type = "pane"
command = "pi"
description = "sandboxed pi"

[[keys.command]]
key = "prefix+alt+o"
type = "pane"
command = "omp"
description = "sandboxed oh-my-pi"

# tsk board (herdr-plugins registers it via `tsk setup herdr`, which leaves
# these bindings alone once present). Where tsk is absent the keys do nothing.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"
description = "tsk board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "tsk quick capture"
# Pinned: herdr's UI rewrites the value on first use; pinning keeps the file
# matching the source and `mise dot status` clean.
[ui]
agent_panel_sort = "spaces"

# "New worktree" checks out <directory>/<repo>/<branch-slug> as a workspace
# grouped with its repo -- one checkout and one agent per branch. Pinned to
# herdr's documented default, same reasoning as above.
[worktrees]
directory = "~/.herdr/worktrees"

