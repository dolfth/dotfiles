# Managed by mise as a copy, not a symlink: herdr writes this file itself -- `herdr
# config reset-keys` rewrites it and drops a backup beside it, and the first-run wizard
# persists its answer here. A symlink would put both writes (and the backup) into the
# repo checkout. Saved SSH machines (nwa is added on gza) are NOT here: `herdr machine
# add` keeps them as app state in the same directory (`herdr machine list`).

# The first-run notification wizard persists its answer into this file, so
# opt out up front.
onboarding = false

# prefix is ctrl+b; `type = "pane"` gives a real terminal pane that closes
# when the agent exits.
[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "claude"
description = "sandboxed claude-code"

[[keys.command]]
key = "prefix+alt+p"
type = "pane"
command = "pi"
description = "sandboxed pi"

[[keys.command]]
key = "prefix+alt+o"
type = "pane"
command = "omp"
description = "sandboxed oh-my-pi"

# tsk task board (brew smarzban/tap/tsk). The herdr-plugins task registers the plugin
# with `tsk setup herdr`, which leaves these bindings alone once present. prefix+t opens
# or focuses this workspace's board, prefix+a quick-captures a task. Where tsk is absent
# the keys do nothing.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"
description = "tsk board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "tsk quick capture"
# Pinned default: herdr's UI writes the value to disk on first use, so pinning keeps
# the file matching the source and `mise dot status` clean.
[ui]
agent_panel_sort = "spaces"

# Parallel-agent work: "New worktree" on a Git workspace row (or `herdr worktree create
# --branch <name>`) checks out <directory>/<repo>/<branch-slug> as a workspace grouped
# with its repo -- one checkout and one agent per branch, listed together. Pinned to
# herdr's documented default, same reasoning as agent_panel_sort above.
[worktrees]
directory = "~/.herdr/worktrees"

