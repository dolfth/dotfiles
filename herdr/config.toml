# Managed by mise as a copy, not a symlink: herdr writes this file itself --
# `herdr config reset-keys` rewrites it and drops a backup beside it, and the
# first-run wizard persists its answer here. A symlink would put both writes
# (and the backup) into the repo checkout.

# The first-run notification wizard persists its answer into this file, so
# opt out up front.
onboarding = false

# prefix is ctrl+b; `type = "pane"` gives a real terminal pane that closes
# when the agent exits.
[[keys.command]]
key = "prefix+alt+c"
type = "pane"
command = "claude"
description = "sandboxed claude-code"

[[keys.command]]
key = "prefix+alt+p"
type = "pane"
command = "pi"
description = "sandboxed pi"

[[keys.command]]
key = "prefix+alt+o"
type = "pane"
command = "omp"
description = "sandboxed oh-my-pi"
# "spaces" is herdr's default, but its UI persists the value to disk on
# first use; pinning it keeps the file matching the source so
# `mise dot status` does not flag it as changed.
[ui]
agent_panel_sort = "spaces"

