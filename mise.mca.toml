# mca: the laptop. Select with env = ["mac", "mca"].

[vars]
host = "mca"
accent = "color_purple"
icon = "\U000F0322"  # nf-md-laptop

[env]
HOST = "mca"
KIND = "laptop"

# Window tiling (the cask lives in Brewfile.mca). AeroSpace rewrites this
# file when the layout changes in-app, so it is a merge: the keys in the
# source are ours, everything else AeroSpace or the user wrote stays, and a
# missing file is created from the source.
[dotfiles]
"~/.config/aerospace/aerospace.toml/pinned" = { source = "aerospace/aerospace.toml", merge = true }

# The omp agent config, deployed as on gza: the config is a symlink (local
# edits flow back to the repo), the model catalog is a whole-file template --
# vars.omp_base is the gza tailnet FQDN in the base mise.toml, so the laptop
# reaches the omlx/splash servers over Tailscale MagicDNS.
"~/.omp/agent/config.yml" = "omp/agent/config.yml"
"~/.omp/agent/models.yml" = { source = "omp/agent/models.yml.tera", mode = "template" }

# Background sync. Declared as a launchd agent, not a [bootstrap.services]
# user service: mise 2026.10.15 does not render user-service values (the
# `command` string reaches launchd verbatim -- an unrendered {{
# system_brew_prefix }} became a job whose program was the literal `{{`),
# while [bootstrap.macos.launchd.agents] does (see the gza agents). Same
# label and plist as the old entry (dev.mise.syncthing), so the first
# bootstrap after the move replaces the broken job in place.
[bootstrap.macos.launchd.agents.syncthing]
program = "{{ system_brew_prefix }}/opt/syncthing/bin/syncthing"
args = ["serve", "--no-browser", "--no-restart"]
run_at_load = true
keep_alive_on_failure = true
working_directory = "{{ env.HOME }}"
stdout_path = "{{ env.HOME }}/Library/Logs/syncthing.log"
stderr_path = "{{ env.HOME }}/Library/Logs/syncthing.log"
kickstart = true
