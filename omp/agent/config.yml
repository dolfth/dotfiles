# omp's agent settings (theme, composer shape, thinking level, ...).
# In the repo so a fresh box comes up configured.
#
# omp writes here too -- `/settings` and the model picker persist into it --
# but this is a symlink into this repo, so local changes flow back to the
# source and get committed with the rest of the dotfiles.
composer:
  shape: pi
theme:
  dark: titanium
  light: light
setupVersion: 2
symbolPreset: nerd
defaultThinkingLevel: medium
task:
  maxRecursionDepth: 0
  maxConcurrency: 1
compaction:
  asyncEnabled: false
bash:
  gitGuard: true
checkpoint:
  enabled: true
autoResume: true
display:
  showTurnTime: true
tui:
  completeScrollback: true
memory:
  backend: mnemopi
mnemopi:
  llmMode: none
  noEmbeddings: true
providers:
  cacheWarming: "off"

# Default model for new sessions and automatic scheduled tasks.
# The dense 27B on splash is the default; KAT-Coder (35B MoE) is
# available as splash-kat/bartowski/Kwaipilot_KAT-Coder-V2.5-Dev-GGUF:Q4_K_M.
defaultModel: splash/mlx-community/Qwen3.8-27B-4bit
